<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Welcome back | Millet&More</title><link rel="stylesheet" href="assets/style.css"></head><body>
<div class="auth-top-actions">
  <button class="icon-btn" data-rtl-toggle title="Toggle RTL">⇄</button>
  <button class="icon-btn" data-theme-toggle title="Toggle theme">◐</button>
</div>
<main class="auth-page">
  <div class="auth-box">
    <a class="logo auth-logo" href="Home1.html"><span class="logo-mark">✳</span><span>millet<span style="color:var(--brand2)">&</span>more<small>goodness in every bite</small></span></a>
    <div class="eyebrow">THE GOOD-SNACK CLUB</div>
    <h1>Welcome back</h1>
    <p>Sign in to see your account and keep the good stuff close.</p>
    <form data-demo data-success="Demo form submitted. Connect an authentication service to enable real accounts.">
      <div class="field">
        <label>Email address</label>
        <input type="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="auth-links">
        <a href="#">Forgot password?</a>
        <a href="register.html">Create account</a>
      </div>
      <button class="btn" type="submit">Sign in →</button>
    </form>
    <div class="auth-bottom">New to Millet&More? <a href="register.html">Create an account</a></div>
    <a class="back-home" href="Home1.html">← Back to Millet&More</a>
  </div>
</main>
<div class="toast"></div>
<script src="assets/app.js"></script>
</body></html>
