<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome Back | Millet&More Account Sign In</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- Point 25: Theme & RTL buttons outside the card in mobile view -->
  <div class="auth-top-actions">
    <button class="icon-btn" data-rtl-toggle title="Toggle RTL">⇄</button>
    <button class="icon-btn" data-theme-toggle title="Toggle theme">◐</button>
  </div>

  <main class="auth-page">
    <div class="auth-box">
      <a class="logo auth-logo" href="index.html">
        <span class="logo-mark">✳</span>
        <span>millet<span class="brand-amp">&</span>more<small>goodness in every bite</small></span>
      </a>
      <div class="eyebrow" style="text-align:center">THE GOOD-SNACK CLUB</div>
      <h1>Welcome Back</h1>
      <p>Sign in to track orders, manage your pantry subscriptions, and access member perks.</p>

      <form data-demo data-success="Sign in successful! Redirecting to your dashboard...">
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <input id="loginEmail" type="email" required placeholder="you@example.com">
        </div>

        <!-- Point 18: Password field with eye toggle & properly placed forgot password link -->
        <div class="field">
          <label for="loginPassword">
            <span>Password</span>
            <a href="#" class="forgot-link">Forgot password?</a>
          </label>
          <div class="password-wrap">
            <input id="loginPassword" type="password" required minlength="6" placeholder="Enter your password">
            <button type="button" class="eye-toggle-btn" data-eye-toggle aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <!-- Point 18: Properly aligned checkbox -->
        <label class="form-check">
          <input type="checkbox" checked>
          <span>Keep me signed in on this device</span>
        </label>

        <button class="btn" type="submit">Sign In →</button>
      </form>

      <!-- Point 20: SOCIAL MEDIA SIGN IN BUTTONS -->
      <div class="social-auth-title">Or continue with</div>
      <div class="social-auth-grid">
        <button type="button" class="social-auth-btn" onclick="toast('Connecting with Google...')">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.8 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.6 7.2C.6 9.2 0 10.5 0 12s.6 2.8 1.6 4.8l3.7-2.1z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.2-6.7-5.2L1.6 16c1.9 3.8 5.8 7 10.4 7z"/></svg>
          Google
        </button>
        <button type="button" class="social-auth-btn" onclick="toast('Connecting with Apple...')">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.66-.82 1.11-1.96.99-3.1-.95.04-2.11.64-2.79 1.44-.6.69-1.12 1.83-1 2.94 1.07.08 2.15-.47 2.8-1.28z"/></svg>
          Apple
        </button>
        <button type="button" class="social-auth-btn" onclick="toast('Connecting with Facebook...')">
          <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>

      <div class="auth-bottom">New to Millet&More? <a href="register.html">Create an Account</a></div>
      <a class="back-home" href="index.html">← Back to Millet&More Store</a>
    </div>
  </main>

  <div class="toast"></div>
  <script src="assets/app.js"></script>
</body>
</html>
